# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates
---
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # The BOM and the parent POM move together and frequently require the same
      # jenkins.version bump, so review and fix the baseline once rather than twice.
      jenkins-platform:
        patterns:
          - "io.jenkins.tools.bom:*"
          - "org.jenkins-ci.plugins:plugin"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
