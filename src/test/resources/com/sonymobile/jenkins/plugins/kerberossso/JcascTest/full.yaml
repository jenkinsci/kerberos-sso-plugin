security:
  kerberosSso:
    enabled: true
    accountName: foo
    password: bar
    redirect: '${REDIRECT}'
    krb5Location: '${KRB5_CONF}'
    loginLocation: '${LOGIN_CONF}'
    loginServerModule: 'spnego-server'
    loginClientModule: 'spnego-client'
    anonymousAccess: true
    bypassPaths:
      - '/login'
    machinePrincipalPatterns:
      - 'host/*@EXAMPLE.COM'
    allowLocalhost: false
    allowBasic: false
    allowDelegation: true
    allowUnsecureBasic: false
    promptNtlm: false
